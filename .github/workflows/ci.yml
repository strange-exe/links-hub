# Lint, type-check, build and run the Playwright suite on every push and pull request.
# Tests live here rather than in the Cloudflare build: Workers Builds has no Playwright browsers, so
# `npm run test:e2e` there fails before any test runs. Cloudflare only builds and deploys.
# Docs: https://playwright.dev/docs/ci-intro
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
